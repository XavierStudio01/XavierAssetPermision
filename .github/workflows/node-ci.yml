name: XavierAssetPermision checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
      - name: Windows installer with spaces in path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP 'Xavier Suite Test\XavierAssetPermision'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE '*') -Destination $dst -Recurse -Force
          Push-Location $dst
          try {
            cmd.exe /d /c 'install.cmd'
            if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
            & XavierAssetPermision.cmd --version
            if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
          } finally { Pop-Location }
